name: Shell Shore
options:
  bundleIdPrefix: com.shimondeitel.shellshore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Shell Shore:
    type: application
    platform: iOS
    sources:
      - path: Shell Shore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.shellshore
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Shell Shore/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  Shell ShoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shell ShoreTests
      - path: Shell Shore.storekit
    dependencies:
      - target: Shell Shore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.shellshore.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  Shell ShoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Shell ShoreUITests
    dependencies:
      - target: Shell Shore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.shellshore.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Shell Shore:
    build:
      targets:
        Shell Shore: all
        Shell ShoreTests: [test]
        Shell ShoreUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Shell Shore.storekit
    test:
      config: Debug
      storeKitConfiguration: Shell Shore.storekit
      targets:
        - Shell ShoreTests
        - Shell ShoreUITests
    archive:
      config: Release
